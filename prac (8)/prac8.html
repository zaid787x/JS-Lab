<!DOCTYPE html>

<html>
<head>
    <title>Gym Admission Form</title>
    <style>
        * {
            box-sizing: border-box;
        }

    body {
        font-family: Arial, sans-serif;
        background: #eef1f4;
        margin: 0;
        padding: 30px 15px;
        color: #333;
    }

    .container {
        width: 420px;
        max-width: 100%;
        margin: 20px auto;
        padding: 25px;
        background: #ffffff;
        border: 1px solid #d9dee3;
        border-radius: 6px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    .student-info {
        position: fixed;
        top: 18px;
        right: 18px;
        background: #ffffff;
        border: 1px solid #d9dee3;
        border-radius: 8px;
        padding: 8px 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        text-align: right;
        font-size: 12px;
        color: #333;
        z-index: 10;
    }

    .student-info strong {
        display: block;
        margin-bottom: 2px;
    }

    h2 {
        text-align: center;
        margin: 0 0 8px;
        color: #222;
        font-size: 24px;
    }

    .intro {
        text-align: center;
        font-size: 13px;
        color: #777;
        margin-bottom: 22px;
    }

    label {
        display: block;
        margin-top: 13px;
        margin-bottom: 5px;
        font-size: 14px;
        font-weight: bold;
    }

    input, select {
        width: 100%;
        padding: 10px;
        margin-top: 2px;
        border: 1px solid #cfd4d9;
        border-radius: 4px;
        font-size: 14px;
        outline: none;
    }

    input:focus, select:focus {
        border-color: #555;
    }

    .error {
        display: block;
        color: #d93025;
        font-size: 13px;
        margin-top: 4px;
        min-height: 16px;
    }

    .success {
        color: #218739;
        font-size: 14px;
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
    }

    button {
        width: 100%;
        padding: 11px;
        margin-top: 18px;
        background: #333;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 15px;
    }

    button:hover {
        background: #555;
    }
</style>

</head>
<body>

<div class="student-info">
    <strong>Mohammed Zaid Shaikh</strong>
    <span>PRN: 24070521043</span>
</div>

<div class="container">
    <h2>Gym Admission Form</h2>
    <p class="intro">Fill in your details to join</p>

<form id="gymForm">

    <label>Full Name</label>
    <input type="text" id="name" placeholder="Enter your full name">
    <span id="nameError" class="error"></span>

    <label>Age</label>
    <input type="number" id="age" placeholder="Enter your age">
    <span id="ageError" class="error"></span>

    <label>Email</label>
    <input type="email" id="email" placeholder="Enter your email">
    <span id="emailError" class="error"></span>

    <label>Mobile Number</label>
    <input type="text" id="mobile" placeholder="Enter 10-digit mobile number">
    <span id="mobileError" class="error"></span>

    <label>Membership Plan</label>
    <select id="plan">
        <option value="">Select Plan</option>
        <option>Monthly</option>
        <option>Quarterly</option>
        <option>Yearly</option>
    </select>
    <span id="planError" class="error"></span>

    <button type="submit">Submit Application</button>

    <p id="result" class="success"></p>

</form>

</div>

<script>
    document.getElementById("name").addEventListener("input", function(){
        let name=this.value;
        if(/^[A-Za-z ]+$/.test(name)){
            document.getElementById("nameError").innerHTML="";
        }else{
            document.getElementById("nameError").innerHTML="Only letters allowed.";
        }
    });

    document.getElementById("age").addEventListener("blur", function(){
        let age=this.value;
        if(age>=16 && age<=60){
            document.getElementById("ageError").innerHTML="";
        }else{
            document.getElementById("ageError").innerHTML="Age must be between 16 and 60.";
        }
    });

    document.getElementById("email").addEventListener("input", function(){
        let email=this.value;
        let pattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if(pattern.test(email)){
            document.getElementById("emailError").innerHTML="";
        }else{
            document.getElementById("emailError").innerHTML="Invalid email.";
        }
    });

    document.getElementById("mobile").addEventListener("input", function(){
        let mobile=this.value;

        if(/^\d{10}$/.test(mobile)){
            document.getElementById("mobileError").innerHTML="";
        }else{
            document.getElementById("mobileError").innerHTML="Enter 10-digit mobile number.";
        }
    });

    document.getElementById("plan").addEventListener("change", function(){
        if(this.value==""){
            document.getElementById("planError").innerHTML="Please select a plan.";
        }else{
            document.getElementById("planError").innerHTML="";
        }
    });

    document.getElementById("gymForm").addEventListener("submit", function(e){

        e.preventDefault();

        if(
            document.getElementById("nameError").innerHTML=="" &&
            document.getElementById("ageError").innerHTML=="" &&
            document.getElementById("emailError").innerHTML=="" &&
            document.getElementById("mobileError").innerHTML=="" &&
            document.getElementById("plan").value!=""
        ){
            document.getElementById("result").innerHTML="Gym Admission Successful!";
        }
        else{
            document.getElementById("result").innerHTML="";
            alert("Please correct the errors before submitting.");
        }
    });

</script>

</body>
</html>
