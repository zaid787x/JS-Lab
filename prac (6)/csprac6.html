<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Form Validation</title>
<link rel="stylesheet" href="csprac6.css" />
</head>
<body>

<div class="form-container">
  <h2>Registration Form</h2>
  <form id="myForm" novalidate>
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required />
      <div class="error" id="nameError"></div>
    </div>
    <div class="form-group">
      <label for="gender">Gender:</label>
      <select id="gender" name="gender" required>
        <option value="">Select gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
      <div class="error" id="genderError"></div>
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />
      <div class="error" id="emailError"></div>
    </div>
    <div class="form-group">
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required />
      <div class="error" id="passwordError"></div>
    </div>
    <button type="submit">Register</button>
  </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('emailError');
        const myForm = document.getElementById('myForm');

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

        function checkEmail() {
            const emailValue = emailInput.value.trim();
            const parentGroup = emailInput.closest('.form-group');

            if (emailValue === '') {
                parentGroup.classList.remove('success', 'error');
                emailError.textContent = '';
                return false;
            }

            if (!emailValue.includes('@')) {
                setEmailError(parentGroup, 'Email must contain "@".');
                return false;
            }

            const parts = emailValue.split('@');

            if (parts[0].trim() === '' || parts.length > 2) {
                setEmailError(parentGroup, 'Please include a valid username before "@".');
                return false;
            }

            if (parts[1].trim() === '') {
                setEmailError(parentGroup, 'Please include a domain after "@".');
                return false;
            }

            const domainPart = parts[1];

            if (!domainPart.includes('.')) {
                setEmailError(parentGroup, 'Domain must contain a dot (.) followed by an extension.');
                return false;
            }

            const domainPieces = domainPart.split('.');
            const topLevelDomain = domainPieces[domainPieces.length - 1];

            if (topLevelDomain.trim() === '' || domainPieces.length < 2) {
                setEmailError(parentGroup, 'Please enter a full domain extension after the dot.');
                return false;
            }

            if (topLevelDomain.length < 2) {
                setEmailError(parentGroup, 'The domain extension must be at least 2 characters long.');
                return false;
            }

            if (emailRegex.test(emailValue)) {
                parentGroup.classList.remove('error');
                parentGroup.classList.add('success');
                emailError.textContent = 'This email address format is valid.';
                return true;
            } else {
                setEmailError(parentGroup, 'Please enter a valid email format (e.g., name@domain.com).');
                return false;
            }
        }

        function setEmailError(element, message) {
            element.classList.remove('success');
            element.classList.add('error');
            emailError.textContent = message;
        }

        emailInput.addEventListener('input', checkEmail);

        myForm.addEventListener('submit', (e) => {
            const isEmailValid = checkEmail();
            const parentGroup = emailInput.closest('.form-group');

            if (emailInput.value.trim() === '') {
                e.preventDefault();
                setEmailError(parentGroup, 'Email address cannot be empty.');
            } else if (!isEmailValid) {
                e.preventDefault();
            }
        });
    });
</script>

</body>
</html>
