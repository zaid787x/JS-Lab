<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIT Nagpur - Student Information</title>
    <!-- CSS is still external as requested -->
    <link rel="stylesheet" href="prac1.css">
</head>
<body>

    <div class="main-wrapper">
        <!-- Left Side: Input Form -->
        <div class="form-container">
            <h1>Welcome to SIT NAGPUR</h1>
            <h2>Student Information</h2>

            <form id="studentForm">
                <div class="form-group">
                    <label for="name">Enter Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter Name" required>
                </div>

                <div class="form-group">
                    <label for="age">Enter Age:</label>
                    <input type="number" id="age" name="age" placeholder="Enter Age" required>
                </div>

                <div class="form-group">
                    <label for="prn">Enter PRN:</label>
                    <input type="text" id="prn" name="prn" placeholder="Enter PRN" required>
                </div>

                <div class="form-group">
                    <label for="contact">Enter Contact Number:</label>
                    <input type="tel" id="contact" name="contact" placeholder="Enter Contact Number" required>
                </div>

                <div class="form-group">
                    <label for="email">Enter Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter Email" required>
                </div>

                <div class="form-group">
                    <label for="address">Enter Address:</label>
                    <input type="text" id="address" name="address" placeholder="Enter Address" required>
                </div>

                <button type="submit">Submit</button>
            </form>
        </div>

        <!-- Right Side: Output Display Area -->
        <div id="result-container" class="result-container">
            <!-- JavaScript will inject the submitted data here -->
        </div>
    </div>

    <!-- Internal JavaScript -->
    <script>
        document.getElementById('studentForm').addEventListener('submit', function(event) {
            // Prevent the default form submission (which refreshes the page)
            event.preventDefault();

            // Fetch values from the input fields
            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            const prn = document.getElementById('prn').value;
            const contact = document.getElementById('contact').value;
            const email = document.getElementById('email').value;
            const address = document.getElementById('address').value;

            // Target the empty result container on the right
            const resultContainer = document.getElementById('result-container');

            // Create the HTML structure for the result card
            resultContainer.innerHTML = `
                <h2>Student Record: ${name}</h2>
                <div class="result-item">
                    <strong>Full Name:</strong> <span>${name}</span>
                </div>
                <div class="result-item">
                    <strong>Age:</strong> <span>${age}</span>
                </div>
                <div class="result-item">
                    <strong>PRN Number:</strong> <span>${prn}</span>
                </div>
                <div class="result-item">
                    <strong>Contact:</strong> <span>${contact}</span>
                </div>
                <div class="result-item">
                    <strong>Email ID:</strong> <span>${email}</span>
                </div>
                <div class="result-item">
                    <strong>Address:</strong> <span>${address}</span>
                </div>
            `;

            // Make the result container visible by adding the active class
            resultContainer.classList.add('active');
        });
    </script>
</body>
</html>
